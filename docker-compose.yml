version: "3.8"

services:
  # ── Backend API Server ──────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cc_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=cc_super_secret_jwt_key_2026_bakery_finance
      - JWT_REFRESH_SECRET=cc_refresh_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
    volumes:
      - server_data:/app/prisma
      - server_uploads:/app/uploads
    restart: always

  # ── Frontend Web App ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cc_frontend
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: always

volumes:
  server_data:
  server_uploads:
